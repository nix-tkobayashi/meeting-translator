name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write  # Azure OIDC login for code signing

# Code signing (Azure Artifact Signing) runs only when these repository variables are set:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   SIGNING_ENDPOINT (e.g. https://jpe.codesigning.azure.net/), SIGNING_ACCOUNT_NAME, SIGNING_CERTIFICATE_PROFILE
env:
  SIGNING_ENABLED: ${{ vars.SIGNING_ACCOUNT_NAME != '' }}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pyinstaller-hooks-contrib

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Set version
        shell: pwsh
        run: |
          $v = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-dev' }
          "APP_VERSION=$v" >> $env:GITHUB_ENV
          "__version__ = '$v'" | Set-Content -Encoding utf8 version.py

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir --name MeetingTranslator
          --collect-data soundcard --collect-submodules amazon_transcribe app.py

      - name: Azure login
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Sign EXE
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files: ${{ github.workspace }}\dist\MeetingTranslator\MeetingTranslator.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Smoke test EXE
        shell: pwsh
        run: |
          # Windowed builds show a dialog on import errors instead of exiting, so enforce a timeout.
          $env:MEETING_TRANSLATOR_SMOKE_TEST = '1'
          $p = Start-Process dist/MeetingTranslator/MeetingTranslator.exe -PassThru
          if (-not $p.WaitForExit(120000)) { Stop-Process -Id $p.Id -Force; throw 'EXE did not exit (startup error dialog?)' }
          if ($p.ExitCode -ne 0) { throw "EXE exited with $($p.ExitCode)" }

      - name: Build ZIP
        shell: pwsh
        run: Compress-Archive -Path dist/MeetingTranslator/* -DestinationPath dist/MeetingTranslator-Windows.zip

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
          & $iscc "/DAppVersion=$env:APP_VERSION" installer\MeetingTranslator.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Sign installer
        if: env.SIGNING_ENABLED == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.SIGNING_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\dist\installer
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - uses: actions/upload-artifact@v4
        with:
          name: MeetingTranslator-Windows-${{ env.APP_VERSION }}
          path: |
            dist/MeetingTranslator-Windows.zip
            dist/installer/*.exe

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/MeetingTranslator-Windows.zip (Get-Item dist/installer/*.exe).FullName --title $env:GITHUB_REF_NAME --generate-notes
